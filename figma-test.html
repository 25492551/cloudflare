<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Images Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #1e3a8a;
      padding-bottom: 10px;
    }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .image-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      background: #fafafa;
    }
    .image-item img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }
    .image-item .filename {
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div style="margin: 20px;"><a href="index.html">🏠 Home</a></div>
  <div class="container">
    <h1>Figma Images Test Page</h1>
    <div class="status success">
      ✅ Local server is running. This page tests images from the figma folder.
    </div>
    
    <h2>Test Images</h2>
    <div class="image-grid" id="imageGrid">
      <!-- Images are loaded dynamically here -->
    </div>
  </div>

  <script>
    // List of main figma image files
    const figmaImages = [
      'HUMMAN RESEARCH.png',
      'HUMMAN RESEARCH.svg',
      'RECODING YOUR VITALITY.png',
      'RECODING YOUR VITALITY.svg',
      'THE FUTURE OF ENDOGENOUS LIPID SIGNALING.png',
      'NAE Platform.png',
      'NAE Platform.svg',
      'SCIENCE.png',
      'PLATFORM.png',
      'R&D.png',
      'EXPERIENCE.png',
      'Rectangle 1.png',
      'Mask group.png',
      'Vector 2.png',
      'Ellipse 1.png',
    ];

    const imageGrid = document.getElementById('imageGrid');
    const basePath = '/images/figma/';

    figmaImages.forEach(filename => {
      const imageItem = document.createElement('div');
      imageItem.className = 'image-item';
      
      const img = document.createElement('img');
      // URL encode to handle spaces
      img.src = basePath + encodeURIComponent(filename);
      img.alt = filename;
      img.onerror = function() {
        this.style.border = '2px solid red';
        this.alt = '❌ Load failed: ' + filename;
      };
      img.onload = function() {
        this.style.border = '2px solid green';
      };
      
      const filenameDiv = document.createElement('div');
      filenameDiv.className = 'filename';
      filenameDiv.textContent = filename;
      
      imageItem.appendChild(img);
      imageItem.appendChild(filenameDiv);
      imageGrid.appendChild(imageItem);
    });

    // Check status after page load
    window.addEventListener('load', () => {
      console.log('Figma images test page loaded');
      console.log('Base path:', basePath);
      console.log('Testing images:', figmaImages.length);
    });
  </script>
</body>
</html>
